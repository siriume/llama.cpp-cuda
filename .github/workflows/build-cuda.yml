name: Build llama.cpp CUDA SM86

on:
  schedule:
    # Daily check at 00:17 UTC (08:17 Asia/Taipei)
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild the latest upstream release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: llama-cpp-cuda-build
  cancel-in-progress: false

env:
  CUDA_VERSION: "12.8.1"
  CUDA_VERSION_SHORT: "12.8"
  CUDA_IMAGE: "nvidia/cuda:12.8.1-devel-ubuntu22.04"

  # RTX 3090 = SM86. "-real" only emits native SASS, avoiding extra PTX.
  # For 3090 + 4090 later, change to: 86-real;89-real
  CUDA_ARCHS: "86-real"
  ARCH_LABEL: "sm86"

  CCACHE_DIR: "${{ github.workspace }}/.ccache"
  CCACHE_MAXSIZE: "2G"
  CCACHE_PREFIX: "llama-cuda12.8-sm86"
  KEEP_CCACHE_COUNT: "3"

  # Release retention:
  # - always keep the newest 15 releases
  # - additionally keep the last release of every calendar month
  KEEP_RECENT_RELEASES: "15"

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_hash: ${{ steps.check.outputs.release_hash }}
      force_rebuild: ${{ steps.check.outputs.force_rebuild }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check latest llama.cpp release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"

          LATEST_JSON="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}"
          )"

          LATEST_RELEASE="$(jq -er '.tag_name' <<<"${LATEST_JSON}")"

          # Resolve the actual commit pointed to by the upstream tag.
          RELEASE_HASH="$(
            git ls-remote https://github.com/ggml-org/llama.cpp.git \
              "refs/tags/${LATEST_RELEASE}^{}" |
              awk 'NR == 1 {print $1}'
          )"

          if [[ -z "${RELEASE_HASH}" ]]; then
            RELEASE_HASH="$(
              git ls-remote https://github.com/ggml-org/llama.cpp.git \
                "refs/tags/${LATEST_RELEASE}" |
                awk 'NR == 1 {print $1}'
            )"
          fi

          if [[ -z "${RELEASE_HASH}" ]]; then
            echo "::error::Unable to resolve upstream tag ${LATEST_RELEASE}"
            exit 1
          fi

          FORCE_REBUILD="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_build }}" == "true" ]]; then
            FORCE_REBUILD="true"
          fi

          echo "Latest upstream release: ${LATEST_RELEASE}"
          echo "Upstream commit:        ${RELEASE_HASH}"
          echo "Force rebuild:          ${FORCE_REBUILD}"

          if gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/${LATEST_RELEASE}" \
              >/dev/null 2>&1; then
            echo "Release ${LATEST_RELEASE} already exists in this repository."

            if [[ "${FORCE_REBUILD}" == "true" ]]; then
              SHOULD_BUILD="true"
            else
              SHOULD_BUILD="false"
            fi
          else
            echo "New upstream release detected: ${LATEST_RELEASE}"
            SHOULD_BUILD="true"
          fi

          {
            echo "should_build=${SHOULD_BUILD}"
            echo "release_tag=${LATEST_RELEASE}"
            echo "release_hash=${RELEASE_HASH}"
            echo "force_rebuild=${FORCE_REBUILD}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build CUDA 12.8 SM86
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true

          docker system prune -af || true

          echo "=== Disk space after cleanup ==="
          df -h

      # Each upstream tag gets a new immutable Actions cache key.
      # restore-keys automatically pulls the newest previous cache, so b10442
      # can reuse almost everything compiled for b10441, while the newly
      # updated cache is still saved under the new tag.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_PREFIX }}-${{ runner.os }}-${{ needs.check-release.outputs.release_tag }}
          restore-keys: |
            ${{ env.CCACHE_PREFIX }}-${{ runner.os }}-
            ${{ env.CCACHE_PREFIX }}-

      - name: Prepare ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${CCACHE_DIR}"

          echo "ccache path: ${CCACHE_DIR}"
          echo "ccache max:  ${CCACHE_MAXSIZE}"
          echo "cache hit:   ${{ steps.ccache-restore.outputs.cache-hit }}"

          du -sh "${CCACHE_DIR}" 2>/dev/null || true

      - name: Pull CUDA build image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${CUDA_IMAGE}"

      - name: Build llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check-release.outputs.release_tag }}"
          HASH="${{ needs.check-release.outputs.release_hash }}"

          rm -rf llama.cpp binaries
          mkdir -p binaries

          docker run --rm \
            -v "${PWD}:/workspace" \
            -v "${CCACHE_DIR}:/ccache" \
            -e RELEASE_TAG="${TAG}" \
            -e RELEASE_HASH="${HASH}" \
            -e CUDA_ARCHS="${CUDA_ARCHS}" \
            -e CCACHE_DIR="/ccache" \
            -e CCACHE_MAXSIZE="${CCACHE_MAXSIZE}" \
            "${CUDA_IMAGE}" \
            bash -lc '
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive

              echo "=== Install minimal build dependencies ==="
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                ca-certificates \
                ccache \
                cmake \
                git \
                ninja-build \
                build-essential \
                libssl-dev \
                pkg-config
              rm -rf /var/lib/apt/lists/*

              echo "=== Configure ccache ==="
              mkdir -p "${CCACHE_DIR}"

              # The compiler/container version is pinned by CUDA_IMAGE, so
              # compiler_check=none avoids repeatedly hashing huge nvcc files.
              ccache --set-config=cache_dir="${CCACHE_DIR}"
              ccache --set-config=max_size="${CCACHE_MAXSIZE}"
              ccache --set-config=compression=true
              ccache --set-config=compression_level=6
              ccache --set-config=compiler_check=none
              ccache --set-config=hash_dir=false
              ccache --set-config=hard_link=false

              export CCACHE_BASEDIR="/workspace/llama.cpp"
              export CCACHE_NOHASHDIR="true"
              export CCACHE_COMPILERCHECK="none"
              export CCACHE_NOHARDLINK="true"

              # Reset stats only; cached objects are preserved.
              ccache --zero-stats || true
              ccache --show-stats || true

              echo "=== Clone llama.cpp ${RELEASE_TAG} ==="
              cd /workspace

              git clone \
                --filter=blob:none \
                --no-checkout \
                https://github.com/ggml-org/llama.cpp.git \
                llama.cpp

              cd llama.cpp
              git fetch --depth 1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
              git checkout --detach "${RELEASE_HASH}"

              echo "=== Configure CUDA build ==="
              export LIBRARY_PATH="/usr/local/cuda/lib64/stubs${LIBRARY_PATH:+:${LIBRARY_PATH}}"
              ln -sf \
                /usr/local/cuda/lib64/stubs/libcuda.so \
                /usr/local/cuda/lib64/stubs/libcuda.so.1

              cmake -S . -B build \
                -G Ninja \
                -DGGML_CUDA=ON \
                -DGGML_CUDA_NCCL=OFF \
                -DGGML_NATIVE=OFF \
                -DGGML_CCACHE=ON \
                -DGGML_CUDA_COMPRESSION_MODE=size \
                -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCHS}" \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DLLAMA_BUILD_TESTS=OFF \
                -DLLAMA_BUILD_EXAMPLES=OFF \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
                -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,/usr/local/cuda/lib64/stubs" \
                -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-rpath-link,/usr/local/cuda/lib64/stubs"

              echo "=== Build with Ninja ==="
              cmake --build build --config Release -j"$(nproc)"

              echo "=== ccache stats ==="
              ccache --show-stats
              ccache --show-compression || true

              echo "=== Package build/bin ==="
              OUT="/workspace/binaries/llama-${RELEASE_TAG}-linux-cuda12.8-sm86-x64"
              mkdir -p "${OUT}"

              # Keep upstream build/bin intact so newly-added helper libraries
              # are not accidentally omitted by a hand-maintained allowlist.
              cp -a build/bin/. "${OUT}/"

              # Strip executables and our shared libraries. Failure on scripts
              # or non-ELF files is harmless.
              find "${OUT}" -maxdepth 1 -type f -executable \
                -exec strip --strip-unneeded {} + 2>/dev/null || true

              find "${OUT}" -maxdepth 1 -type f -name "*.so*" \
                -exec strip --strip-unneeded {} + 2>/dev/null || true

              printf "%s\n" \
                "llama.cpp version: ${RELEASE_TAG}" \
                "llama.cpp commit: ${RELEASE_HASH}" \
                "CUDA version: 12.8.1" \
                "CUDA architectures: ${CUDA_ARCHS}" \
                "NCCL: OFF" \
                "Host architecture: x86_64" \
                "Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                > "${OUT}/VERSION.txt"

              echo "=== Build output ==="
              du -sh "${OUT}"
              ls -lh "${OUT}" | head -100
            '

          # Container writes as root.
          sudo chown -R "$(id -u):$(id -g)" "${CCACHE_DIR}" binaries

          echo "=== Host ccache size ==="
          du -sh "${CCACHE_DIR}" || true

      - name: Create release tarball and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check-release.outputs.release_tag }}"
          DIR="llama-${TAG}-linux-cuda12.8-sm86-x64"
          ARCHIVE="${DIR}.tar.zst"

          cd binaries

          # zstd decompresses much faster than gzip and generally gives a
          # better size/speed balance for release binaries.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
          sudo rm -rf /var/lib/apt/lists/*

          tar --zstd -cf "${ARCHIVE}" "${DIR}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

          ls -lh "${ARCHIVE}" "${ARCHIVE}.sha256"

      - name: Save updated ccache
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_PREFIX }}-${{ runner.os }}-${{ needs.check-release.outputs.release_tag }}

      - name: Keep only newest ccache snapshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="${CCACHE_PREFIX}-${RUNNER_OS}-"
          KEEP="${KEEP_CCACHE_COUNT}"

          echo "Keeping newest ${KEEP} caches with prefix: ${PREFIX}"

          # Get matching repository caches, newest first, and remove older ones.
          mapfile -t OLD_CACHE_IDS < <(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
              --jq ".actions_caches
                    | map(select(.key | startswith(\"${PREFIX}\")))
                    | sort_by(.created_at)
                    | reverse
                    | .[${KEEP}:]
                    | .[].id"
          )

          for id in "${OLD_CACHE_IDS[@]:-}"; do
            [[ -z "${id}" ]] && continue
            echo "Deleting old Actions cache id=${id}"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || true
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ needs.check-release.outputs.release_tag }}-linux-cuda12.8-sm86-x64
          path: |
            binaries/*.tar.zst
            binaries/*.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove CUDA image
        if: always()
        shell: bash
        run: |
          docker rmi "${CUDA_IMAGE}" || true
          docker system prune -af || true

  release:
    name: Publish GitHub Release
    needs: [check-release, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.zst" -o -name "*.sha256" \) \
            -exec cp -v {} release-assets/ \;

          test -n "$(find release-assets -type f -name '*.tar.zst' -print -quit)"
          ls -lh release-assets

      - name: Replace existing release on forced rebuild
        if: needs.check-release.outputs.force_rebuild == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check-release.outputs.release_tag }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Deleting existing release ${TAG} before forced republish..."
            gh release delete "${TAG}" --yes --cleanup-tag
          fi

      # A fresh empty commit gives every release tag a current commit date,
      # avoiding GitHub's release-list sorting problem when all tags point at
      # the same old main commit.
      - name: Create advancing release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check-release.outputs.release_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists unexpectedly."
            exit 1
          fi

          git commit --allow-empty \
            -m "llama.cpp ${TAG} CUDA 12.8 SM86 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.release_tag }}
          name: llama.cpp ${{ needs.check-release.outputs.release_tag }} - CUDA 12.8 SM86
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## llama.cpp CUDA build

            - Upstream: https://github.com/ggml-org/llama.cpp/releases/tag/${{ needs.check-release.outputs.release_tag }}
            - Commit: `${{ needs.check-release.outputs.release_hash }}`
            - Host: Linux x86_64 / Ubuntu
            - CUDA build image: `${{ env.CUDA_IMAGE }}`
            - GPU architecture: **SM86 / RTX 30 series**
            - NCCL: **OFF**
            - CUDA runtime / cuBLAS: **not bundled**
            - Package: `.tar.zst` + SHA256

            This is a thin CUDA build. The target machine must provide a compatible
            NVIDIA driver and CUDA 12.x runtime libraries.

  prune-releases:
    name: Prune old releases
    needs: [check-release, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Keep latest 15 + last release of every month
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_RECENT="${KEEP_RECENT_RELEASES}"

          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT

          echo "Fetching release history..."

          # --paginate emits one row per release across all pages.
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] |
                  select(.draft == false and .prerelease == false) |
                  [.id, .tag_name, .published_at] |
                  @tsv' \
            > "${TMP}/all.tsv"

          # Only manage llama.cpp-style bNNNN tags. Other releases are untouched.
          awk -F'\t' '$2 ~ /^b[0-9]+$/ && $3 != ""' \
            "${TMP}/all.tsv" \
            | sort -t$'\t' -k3,3r \
            > "${TMP}/sorted.tsv"

          TOTAL="$(wc -l < "${TMP}/sorted.tsv" | tr -d ' ')"
          echo "Managed releases: ${TOTAL}"

          if [[ "${TOTAL}" -le "${KEEP_RECENT}" ]]; then
            echo "Nothing to prune: ${TOTAL} <= ${KEEP_RECENT}"
            exit 0
          fi

          # 1) Always keep newest N releases.
          head -n "${KEEP_RECENT}" "${TMP}/sorted.tsv" \
            | cut -f2 \
            > "${TMP}/keep.txt"

          # 2) sorted.tsv is newest-first, so the first row seen for YYYY-MM is
          #    exactly the last (newest) release published in that month.
          awk -F'\t' '
            {
              month = substr($3, 1, 7)
              if (!seen[month]++) {
                print $2
              }
            }
          ' "${TMP}/sorted.tsv" >> "${TMP}/keep.txt"

          sort -u "${TMP}/keep.txt" -o "${TMP}/keep.txt"

          echo "=== Releases to keep ==="
          cat "${TMP}/keep.txt"

          echo "=== Pruning ==="

          while IFS=$'\t' read -r release_id tag published_at; do
            if grep -Fxq "${tag}" "${TMP}/keep.txt"; then
              continue
            fi

            echo "Deleting ${tag} (${published_at})"

            # Delete release object.
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/${release_id}"

            # Delete its tag as well so stale release tags do not accumulate.
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              >/dev/null 2>&1 || true

          done < "${TMP}/sorted.tsv"