name: Build llama.cpp CUDA

on:
  schedule:
    # Daily check at 00:17 UTC
    - cron: "17 0 * * *"

  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild the latest official bNNNN llama.cpp release"
        required: false
        type: boolean
        default: false

      build_profiles:
        description: "CUDA profiles, comma separated: sm86,sm89,sm86-sm89,universal"
        required: true
        type: string
        default: "sm86,sm89"

      nccl:
        description: "NCCL build variant"
        required: true
        type: choice
        default: "off"
        options:
          - "off"
          - "on"
          - both

permissions:
  contents: write
  actions: write

concurrency:
  group: llama-cpp-cuda-release
  cancel-in-progress: false

env:
  CUDA_VERSION: "12.8.1"
  CUDA_VERSION_SHORT: "12.8"
  CUDA_IMAGE: "nvidia/cuda:12.8.1-devel-ubuntu22.04"

  # Scheduled build defaults
  # Scheduled builds: comma-separated profile list
  SCHEDULE_BUILD_PROFILES: "sm86,sm89"
  SCHEDULE_NCCL: "off"

  # ccache
  CCACHE_MAXSIZE: "2G"
  CCACHE_COMPRESSION_LEVEL: "6"
  KEEP_CCACHE_COUNT: "8"

  # Release retention
  KEEP_RECENT_RELEASES: "15"

jobs:
  check-release:
    name: Check official llama.cpp nightly
    runs-on: ubuntu-latest

    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_hash: ${{ steps.check.outputs.release_hash }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest official llama.cpp bNNNN release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching official llama.cpp releases..."

          RELEASES="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/ggml-org/llama.cpp/releases?per_page=100"
          )"

          TAG="$(
            jq -er '
              [
                .[]
                | select(.draft == false)
                | select(.tag_name | test("^b[0-9]+$"))
                | {
                    tag: .tag_name,
                    build: (.tag_name[1:] | tonumber)
                  }
              ]
              | max_by(.build)
              | .tag
            ' <<<"${RELEASES}"
          )"

          if [[ -z "${TAG}" || ! "${TAG}" =~ ^b[0-9]+$ ]]; then
            echo "::error::Unable to find official llama.cpp bNNNN release"
            exit 1
          fi

          echo "Latest official nightly tag: ${TAG}"

          HASH="$(
            git ls-remote https://github.com/ggml-org/llama.cpp.git \
              "refs/tags/${TAG}^{}" |
              awk 'NR == 1 {print $1}'
          )"

          if [[ -z "${HASH}" ]]; then
            HASH="$(
              git ls-remote https://github.com/ggml-org/llama.cpp.git \
                "refs/tags/${TAG}" |
                awk 'NR == 1 {print $1}'
            )"
          fi

          if [[ -z "${HASH}" ]]; then
            echo "::error::Unable to resolve official llama.cpp tag ${TAG}"
            exit 1
          fi

          FORCE="false"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                "${{ inputs.force_build }}" == "true" ]]; then
            FORCE="true"
          fi

          if gh release view "${TAG}" \
               --repo "${GITHUB_REPOSITORY}" \
               >/dev/null 2>&1; then

            if [[ "${FORCE}" == "true" ]]; then
              SHOULD_BUILD="true"
              echo "Release ${TAG} already exists, but force_build=true."
            else
              SHOULD_BUILD="false"
              echo "Release ${TAG} already exists; skip build."
            fi
          else
            SHOULD_BUILD="true"
            echo "New official llama.cpp nightly detected: ${TAG}"
          fi

          echo
          echo "======================================"
          echo "Official tag:    ${TAG}"
          echo "Official commit: ${HASH}"
          echo "Force build:     ${FORCE}"
          echo "Should build:    ${SHOULD_BUILD}"
          echo "======================================"

          {
            echo "release_tag=${TAG}"
            echo "release_hash=${HASH}"
            echo "should_build=${SHOULD_BUILD}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build dynamic matrix
        id: matrix
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          declare -A ARCHS
          ARCHS[sm86]="86-real"
          ARCHS[sm89]="89-real"
          ARCHS[sm86-sm89]="86-real;89-real"
          ARCHS[universal]="75-virtual;80-virtual;86-virtual;89-virtual;90-virtual;100-virtual;120-virtual"

          PROFILES=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            RAW_PROFILES="${{ inputs.build_profiles }}"
            NCCL_MODE="${{ inputs.nccl }}"

          else

            RAW_PROFILES="${SCHEDULE_BUILD_PROFILES}"
            NCCL_MODE="${SCHEDULE_NCCL}"

          fi

          IFS=',' read -r -a RAW_PROFILE_ARRAY <<< "${RAW_PROFILES}"

          for profile in "${RAW_PROFILE_ARRAY[@]}"; do
            profile="$(echo "${profile}" | xargs)"
            [[ -z "${profile}" ]] && continue
            PROFILES+=("${profile}")
          done

          if [[ "${#PROFILES[@]}" -eq 0 ]]; then
            echo "::error::At least one CUDA build profile must be provided."
            exit 1
          fi

          echo "Selected profiles:"
          printf '  - %s\n' "${PROFILES[@]}"
          echo "NCCL mode: ${NCCL_MODE}"

          NCCL_VALUES=()

          case "${NCCL_MODE}" in
            off)
              NCCL_VALUES+=(OFF)
              ;;
            on)
              NCCL_VALUES+=(ON)
              ;;
            both)
              NCCL_VALUES+=(OFF ON)
              ;;
            *)
              echo "::error::Unknown NCCL mode: ${NCCL_MODE}"
              exit 1
              ;;
          esac

          MATRIX='[]'

          for profile in "${PROFILES[@]}"; do

            if [[ -z "${ARCHS[$profile]+x}" ]]; then
              echo "::error::Unknown build profile: ${profile}"
              exit 1
            fi

            for nccl in "${NCCL_VALUES[@]}"; do

              if [[ "${nccl}" == "ON" ]]; then
                nccl_suffix="nccl"
              else
                nccl_suffix="nonccl"
              fi

              MATRIX="$(
                jq -cn \
                  --argjson current "${MATRIX}" \
                  --arg profile "${profile}" \
                  --arg architectures "${ARCHS[$profile]}" \
                  --arg nccl "${nccl}" \
                  --arg nccl_suffix "${nccl_suffix}" \
                  '$current + [{
                    profile: $profile,
                    architectures: $architectures,
                    nccl: $nccl,
                    nccl_suffix: $nccl_suffix,
                    host_arch: "amd64",
                    runs_on: "ubuntu-latest"
                  }]'
              )"

            done
          done

          COMPACT="$(jq -c '{include: .}' <<<"${MATRIX}")"

          echo "Generated matrix:"
          jq . <<<"${COMPACT}"

          echo "matrix=${COMPACT}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.profile }} / NCCL-${{ matrix.nccl }}
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'

    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-release.outputs.matrix) }}

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Before cleanup ==="
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true

          docker system prune -af || true

          echo "=== After cleanup ==="
          df -h

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}

          key: >-
            llama-ccache-${{ env.CUDA_VERSION_SHORT }}-${{ matrix.host_arch }}-${{
            matrix.profile }}-${{ matrix.nccl_suffix }}-${{
            needs.check-release.outputs.release_tag }}-${{ github.run_id }}

          restore-keys: |
            llama-ccache-${{ env.CUDA_VERSION_SHORT }}-${{ matrix.host_arch }}-${{ matrix.profile }}-${{ matrix.nccl_suffix }}-${{ needs.check-release.outputs.release_tag }}-
            llama-ccache-${{ env.CUDA_VERSION_SHORT }}-${{ matrix.host_arch }}-${{ matrix.profile }}-${{ matrix.nccl_suffix }}-
            llama-ccache-${{ env.CUDA_VERSION_SHORT }}-${{ matrix.host_arch }}-${{ matrix.profile }}-
            llama-ccache-${{ env.CUDA_VERSION_SHORT }}-${{ matrix.host_arch }}-

      - name: Pull CUDA build image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${CUDA_IMAGE}"

      - name: Build llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check-release.outputs.release_tag }}"
          HASH="${{ needs.check-release.outputs.release_hash }}"
          PROFILE="${{ matrix.profile }}"
          ARCHITECTURES="${{ matrix.architectures }}"
          NCCL="${{ matrix.nccl }}"
          NCCL_SUFFIX="${{ matrix.nccl_suffix }}"

          rm -rf llama.cpp binaries
          mkdir -p binaries "${CCACHE_DIR}"

          docker run --rm \
            -v "${PWD}:/workspace" \
            -v "${CCACHE_DIR}:/ccache" \
            -e RELEASE_TAG="${TAG}" \
            -e RELEASE_HASH="${HASH}" \
            -e PROFILE="${PROFILE}" \
            -e CUDA_ARCHITECTURES="${ARCHITECTURES}" \
            -e NCCL="${NCCL}" \
            -e NCCL_SUFFIX="${NCCL_SUFFIX}" \
            -e CCACHE_DIR="/ccache" \
            -e CCACHE_MAXSIZE="${CCACHE_MAXSIZE}" \
            -e CCACHE_COMPRESSION_LEVEL="${CCACHE_COMPRESSION_LEVEL}" \
            "${CUDA_IMAGE}" \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              echo "=== Install base build dependencies ==="

              apt-get update -qq

              apt-get install -y --no-install-recommends \
                ca-certificates \
                ccache \
                cmake \
                git \
                ninja-build \
                build-essential \
                libssl-dev \
                pkg-config

              echo "=== NCCL check ==="

              if [[ "${NCCL}" == "ON" ]]; then

                RUNTIME_OK=false
                DEV_OK=false

                if ldconfig -p | grep -q "libnccl\.so\.2"; then
                  RUNTIME_OK=true
                fi

                if dpkg -s libnccl-dev >/dev/null 2>&1; then
                  DEV_OK=true
                elif [[ -f /usr/include/nccl.h ]] || \
                     [[ -f /usr/local/cuda/include/nccl.h ]]; then
                  DEV_OK=true
                fi

                echo "NCCL runtime available: ${RUNTIME_OK}"
                echo "NCCL dev available:     ${DEV_OK}"

                if [[ "${RUNTIME_OK}" == "true" &&
                      "${DEV_OK}" == "true" ]]; then

                  echo "Existing NCCL installation is sufficient."

                else
                  echo "Installing missing NCCL packages..."

                  apt-get install -y \
                    --no-install-recommends \
                    --allow-change-held-packages \
                    libnccl2 \
                    libnccl-dev
                fi

                echo "=== Installed NCCL packages ==="
                dpkg -l | grep -E "libnccl2|libnccl-dev" || true

                echo "=== NCCL libraries ==="
                ldconfig -p | grep libnccl || true

              else
                echo "NCCL disabled; skipping NCCL package handling."
              fi

              rm -rf /var/lib/apt/lists/*

              echo "=== Configure ccache ==="

              mkdir -p "${CCACHE_DIR}"

              export CCACHE_BASEDIR="/workspace/llama.cpp"
              export CCACHE_NOHASHDIR="true"
              export CCACHE_COMPILERCHECK="none"
              export CCACHE_NOHARDLINK="true"

              ccache --set-config=cache_dir="${CCACHE_DIR}"
              ccache --set-config=max_size="${CCACHE_MAXSIZE}"
              ccache --set-config=compression=true
              ccache --set-config=compression_level="${CCACHE_COMPRESSION_LEVEL}"
              ccache --set-config=compiler_check=none
              ccache --set-config=hash_dir=false
              ccache --set-config=hard_link=false

              ccache --zero-stats || true

              echo "=== Restored ccache status ==="
              ccache --show-stats || true

              echo "=== Fetch official llama.cpp ${RELEASE_TAG} ==="

              cd /workspace

              git clone \
                --filter=blob:none \
                --no-checkout \
                https://github.com/ggml-org/llama.cpp.git \
                llama.cpp

              cd llama.cpp

              git fetch \
                --depth=1 \
                origin \
                "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

              git checkout --detach "${RELEASE_HASH}"

              echo "=== Configure llama.cpp ==="

              echo "Profile:            ${PROFILE}"
              echo "CUDA architectures: ${CUDA_ARCHITECTURES}"
              echo "NCCL:               ${NCCL}"

              export LIBRARY_PATH="/usr/local/cuda/lib64/stubs${LIBRARY_PATH:+:${LIBRARY_PATH}}"

              ln -sf \
                /usr/local/cuda/lib64/stubs/libcuda.so \
                /usr/local/cuda/lib64/stubs/libcuda.so.1

              cmake -S . -B build \
                -G Ninja \
                -DGGML_CUDA=ON \
                -DGGML_CUDA_NCCL="${NCCL}" \
                -DGGML_NATIVE=OFF \
                -DGGML_CCACHE=ON \
                -DGGML_CUDA_COMPRESSION_MODE=size \
                -DCMAKE_CUDA_ARCHITECTURES="${CUDA_ARCHITECTURES}" \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DLLAMA_BUILD_TESTS=OFF \
                -DLLAMA_BUILD_EXAMPLES=OFF \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
                -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,/usr/local/cuda/lib64/stubs" \
                -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-rpath-link,/usr/local/cuda/lib64/stubs"

              echo "=== Build ==="

              cmake --build build \
                --config Release \
                -j"$(nproc)"

              echo "=== Final ccache statistics ==="

              ccache --show-stats
              ccache --show-compression || true

              echo "=== Package build ==="

              OUT="/workspace/binaries/llama-${RELEASE_TAG}-linux-cuda12.8-${PROFILE}-${NCCL_SUFFIX}-x64"

              mkdir -p "${OUT}"

              cp -a build/bin/. "${OUT}/"

              find "${OUT}" \
                -maxdepth 1 \
                -type f \
                -executable \
                -exec strip --strip-unneeded {} + \
                2>/dev/null || true

              find "${OUT}" \
                -maxdepth 1 \
                -type f \
                -name "*.so*" \
                -exec strip --strip-unneeded {} + \
                2>/dev/null || true

              printf "%s\n" \
                "llama.cpp version: ${RELEASE_TAG}" \
                "llama.cpp commit: ${RELEASE_HASH}" \
                "CUDA version: 12.8.1" \
                "Profile: ${PROFILE}" \
                "CUDA architectures: ${CUDA_ARCHITECTURES}" \
                "NCCL: ${NCCL}" \
                "Host architecture: x86_64" \
                "CUDA runtime bundled: NO" \
                "Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                > "${OUT}/VERSION.txt"

              echo "=== Output size ==="
              du -sh "${OUT}"
            '

          sudo chown -R \
            "$(id -u):$(id -g)" \
            "${CCACHE_DIR}" \
            binaries

      - name: Save updated ccache
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}

          key: >-
            llama-ccache-${{ env.CUDA_VERSION_SHORT }}-${{ matrix.host_arch }}-${{
            matrix.profile }}-${{ matrix.nccl_suffix }}-${{
            needs.check-release.outputs.release_tag }}-${{ github.run_id }}

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check-release.outputs.release_tag }}"

          DIR="llama-${TAG}-linux-cuda12.8-${{ matrix.profile }}-${{ matrix.nccl_suffix }}-x64"
          ARCHIVE="${DIR}.tar.zst"

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
          sudo rm -rf /var/lib/apt/lists/*

          cd binaries

          tar --zstd \
            -cf "${ARCHIVE}" \
            "${DIR}"

          sha256sum "${ARCHIVE}" \
            > "${ARCHIVE}.sha256"

          ls -lh \
            "${ARCHIVE}" \
            "${ARCHIVE}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: >-
            llama-${{ needs.check-release.outputs.release_tag }}-${{
            matrix.profile }}-${{ matrix.nccl_suffix }}

          path: |
            binaries/*.tar.zst
            binaries/*.sha256

          if-no-files-found: error
          retention-days: 1

      - name: Remove CUDA image
        if: always()
        shell: bash
        run: |
          docker rmi "${CUDA_IMAGE}" || true
          docker system prune -af || true

  release:
    name: Publish official-tag Release
    needs:
      - check-release
      - build

    if: needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          find artifacts \
            -type f \
            \( -name "*.tar.zst" -o -name "*.sha256" \) \
            -exec cp -v {} release-assets/ \;

          test -n "$(
            find release-assets \
              -type f \
              -name "*.tar.zst" \
              -print \
              -quit
          )"

          ls -lh release-assets

      - name: Mirror official llama.cpp tag exactly
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check-release.outputs.release_tag }}"
          HASH="${{ needs.check-release.outputs.release_hash }}"

          git remote add \
            llama-upstream \
            https://github.com/ggml-org/llama.cpp.git

          git fetch \
            --force \
            llama-upstream \
            "refs/tags/${TAG}:refs/tags/${TAG}"

          RESOLVED="$(
            git rev-parse "${TAG}^{commit}"
          )"

          if [[ "${RESOLVED}" != "${HASH}" ]]; then
            echo "::error::Official tag ${TAG} resolved to ${RESOLVED}, expected ${HASH}"
            exit 1
          fi

          if git ls-remote \
               --exit-code \
               origin \
               "refs/tags/${TAG}" \
               >/dev/null 2>&1; then

            REMOTE_HASH="$(
              git ls-remote origin \
                "refs/tags/${TAG}^{}" |
                awk 'NR == 1 {print $1}'
            )"

            if [[ -z "${REMOTE_HASH}" ]]; then
              REMOTE_HASH="$(
                git ls-remote origin \
                  "refs/tags/${TAG}" |
                  awk 'NR == 1 {print $1}'
              )"
            fi

            if [[ "${REMOTE_HASH}" != "${HASH}" ]]; then
              echo "::error::Existing tag ${TAG} does not match official upstream commit."
              exit 1
            fi

            echo "Existing tag ${TAG} already matches official llama.cpp."

          else
            git push \
              origin \
              "refs/tags/${TAG}:refs/tags/${TAG}"

            echo "Published official tag ${TAG} unchanged."
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.check-release.outputs.release_tag }}"
          HASH="${{ needs.check-release.outputs.release_hash }}"

          cat > release-notes.md <<EOF
          # llama.cpp ${TAG} CUDA Linux builds

          Source release:
          https://github.com/ggml-org/llama.cpp/releases/tag/${TAG}

          Official llama.cpp commit:
          \`${HASH}\`

          ## Build characteristics

          - Ubuntu/Linux x86_64
          - CUDA ${CUDA_VERSION}
          - CUDA runtime / cuBLAS are not bundled
          - Shared llama.cpp libraries are included
          - Package format: .tar.zst + SHA256
          - Release tag exactly matches official llama.cpp: ${TAG}

          ## Build profiles

          - sm86: native SM86 / RTX 30 series
          - sm89: native SM89 / RTX 40 series
          - sm86-sm89: native SM86 + SM89
          - universal: PTX virtual architecture set maintained in workflow

          NCCL variants:

          - nonccl: recommended for single-GPU inference
          - nccl: NCCL-enabled multi-GPU build

          The target machine must provide a compatible NVIDIA driver and CUDA 12.x runtime libraries.
          EOF

          if gh release view "${TAG}" \
               --repo "${GITHUB_REPOSITORY}" \
               >/dev/null 2>&1; then

            echo "Updating existing release ${TAG}"

            gh release upload \
              "${TAG}" \
              release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber

            gh release edit \
              "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "llama.cpp ${TAG} CUDA Linux builds" \
              --notes-file release-notes.md

          else

            echo "Creating release ${TAG}"

            gh release create \
              "${TAG}" \
              release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "llama.cpp ${TAG} CUDA Linux builds" \
              --notes-file release-notes.md
          fi

  prune-ccache:
    name: Prune old ccache snapshots

    needs:
      - check-release
      - build

    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Keep newest ccache snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP="${KEEP_CCACHE_COUNT}"
          PREFIX="llama-ccache-"

          mapfile -t DELETE_IDS < <(
            gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
              --jq '
                .actions_caches[]
                | select(.key | startswith("'"${PREFIX}"'"))
                | [.id, .last_accessed_at]
                | @tsv
              ' \
              | sort -t$'\t' -k2,2r \
              | tail -n "+$((KEEP + 1))" \
              | cut -f1
          )

          for id in "${DELETE_IDS[@]:-}"; do
            [[ -z "${id}" ]] && continue

            echo "Deleting old ccache id=${id}"

            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" \
              || true
          done

  prune-releases:
    name: Keep latest 15 + monthly last

    needs:
      - check-release
      - release

    if: needs.release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Prune old llama.cpp releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          KEEP_RECENT="${KEEP_RECENT_RELEASES}"

          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '
              .[]
              | select(.draft == false and .prerelease == false)
              | [.id, .tag_name, .published_at]
              | @tsv
            ' \
            > "${TMP}/all.tsv"

          awk -F'\t' \
            '$2 ~ /^b[0-9]+$/ && $3 != ""' \
            "${TMP}/all.tsv" \
            | sort -t$'\t' -k3,3r \
            > "${TMP}/sorted.tsv"

          TOTAL="$(
            wc -l < "${TMP}/sorted.tsv" |
            tr -d " "
          )"

          echo "Managed llama.cpp releases: ${TOTAL}"

          if [[ "${TOTAL}" -le "${KEEP_RECENT}" ]]; then
            echo "Nothing to prune."
            exit 0
          fi

          head -n "${KEEP_RECENT}" \
            "${TMP}/sorted.tsv" \
            | cut -f2 \
            > "${TMP}/keep.txt"

          awk -F'\t' '
            {
              month = substr($3, 1, 7)

              if (!seen[month]++) {
                print $2
              }
            }
          ' "${TMP}/sorted.tsv" \
            >> "${TMP}/keep.txt"

          sort -u \
            "${TMP}/keep.txt" \
            -o "${TMP}/keep.txt"

          echo "=== Releases retained ==="
          cat "${TMP}/keep.txt"

          echo "=== Releases removed ==="

          while IFS=$'\t' \
            read -r release_id tag published_at; do

            if grep -Fxq \
                 "${tag}" \
                 "${TMP}/keep.txt"; then
              continue
            fi

            echo "Deleting ${tag} (${published_at})"

            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/${release_id}"

            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              >/dev/null 2>&1 \
              || true

          done < "${TMP}/sorted.tsv"